name: plantpal

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  image_picker: ^1.1.2
  flutter_secure_storage: ^11.2.0
  rive: ^0.14.4
  provider: ^6.1.5+1
  dio: ^5.11.1
  flutter_web_auth_2: ^5.1.0
  json_annotation: 4.9.0
  shimmer: ^4.0.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3

  google_sign_in: ^7.0.0
  google_sign_in_web: ^1.0.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  json_serializable: ^6.11.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/images/products/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/icon.png"

  adaptive_icon_background: "#F8EFDE"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"